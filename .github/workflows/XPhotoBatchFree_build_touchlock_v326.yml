      - name: Ensure stable debug signing key exists
        shell: bash
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -storepass android -keypass android -keystore ~/.android/debug.keystore -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Build APK
        working-directory: xphoto_batch_free
        run: |
          chmod +x gradlew 2>/dev/null || true
          gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp xphoto_batch_free/app/build/outputs/apk/debug/app-debug.apk XPhotoBatchFree_v3.2.6.apk

      - name: APK info
        run: |
          ls -lh XPhotoBatchFree_v3.2.6.apk
          sha256sum XPhotoBatchFree_v3.2.6.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XPhotoBatchFree_v3.2.6
          path: XPhotoBatchFree_v3.2.6.apk
          retention-days: 90
