name: Build XPhotoBatchFree v3.1.2 Scan Fix APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/XPhotoBatchFree_build_scanfix*.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: xphoto-debug-keystore-v1-${{ runner.os }}

      - name: Restore XPhotoBatchFree v3.1.2 source
