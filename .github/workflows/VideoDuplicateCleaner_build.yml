name: Build Video Duplicate Cleaner APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Android project
        run: unzip -q VideoDuplicateCleaner_v1.0.0_source.zip

      - name: Build APK
        working-directory: VideoDuplicateCleaner
        run: gradle :app:assembleRelease

      - name: Rename APK
        run: cp VideoDuplicateCleaner/app/build/outputs/apk/release/app-release.apk VideoDuplicateCleaner_v1.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoDuplicateCleaner_v1.0.0
          path: VideoDuplicateCleaner_v1.0.0.apk
