name: Build AuthorizedVideoSaver v2.1 APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build_v2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/example/authorizedvideosaver

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AuthorizedVideoSaverV2"
          include ":app"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.7.3" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {
              namespace "com.example.authorizedvideosaver"
              compileSdk 35

              defaultConfig {
                  applicationId "com.example.authorizedvideosaver.v2"
                  minSdk 29
                  targetSdk 35
                  versionCode 21
                  versionName "2.1.0"

                  ndk {
                      abiFilters "arm64-v8a"
                  }
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
          }

          dependencies {
              implementation "io.github.junkfood02.youtubedl-android:library:0.18.1"
              implementation "io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1"
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:extractNativeLibs="true"
                  android:label="허용 영상 저장기 v2"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/authorizedvideosaver/MainActivity.java <<'EOF'
          package com.example.authorizedvideosaver;

          import android.app.Activity;
          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.text.TextUtils;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.ScrollView;
          import android.widget.Spinner;
          import android.widget.TextView;
          import android.widget.Toast;

          import com.yausername.ffmpeg.FFmpeg;
          import com.yausername.youtubedl_android.YoutubeDL;
          import com.yausername.youtubedl_android.YoutubeDLRequest;

          import java.io.File;
          import java.io.FileInputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.util.Arrays;
          import java.util.Comparator;
          import java.util.Locale;
          import java.util.UUID;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          import kotlin.Unit;
          import kotlin.jvm.functions.Function3;

          public class MainActivity extends Activity {
              private EditText urlInput;
              private Spinner qualitySpinner;
              private Button downloadButton;
              private Button cancelButton;
              private ProgressBar progressBar;
              private TextView statusView;
              private TextView detailView;

              private final ExecutorService executor = Executors.newSingleThreadExecutor();
              private volatile boolean ready = false;
              private volatile boolean downloading = false;
              private String processId = null;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  buildUi();
                  receiveSharedText(getIntent());
                  initializeDownloader();
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  receiveSharedText(intent);
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  if (downloading && processId != null) {
                      try { YoutubeDL.getInstance().destroyProcessById(processId); } catch (Exception ignored) {}
                  }
                  executor.shutdownNow();
              }

              private void buildUi() {
                  int pad = dp(18);
                  ScrollView scroll = new ScrollView(this);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(pad, pad, pad, pad);
                  scroll.addView(root);

                  TextView title = new TextView(this);
                  title.setText("허용 영상 저장기 v2");
                  title.setTextSize(25);
                  title.setGravity(Gravity.CENTER_HORIZONTAL);
                  title.setPadding(0, 0, 0, dp(10));
                  root.addView(title);

                  TextView notice = new TextView(this);
                  notice.setText("본인이 올린 영상 또는 다운로드 허가를 받은 YouTube 영상만 저장하세요. 로그인·쿠키·유료/비공개 영상·DRM 우회 기능은 포함하지 않습니다.");
                  notice.setTextSize(14);
                  notice.setPadding(0, 0, 0, dp(14));
                  root.addView(notice);

                  urlInput = new EditText(this);
                  urlInput.setHint("YouTube 주소를 붙여넣으세요");
                  urlInput.setMinLines(3);
                  urlInput.setGravity(Gravity.TOP);
                  root.addView(urlInput, new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  ));

                  Button pasteButton = new Button(this);
                  pasteButton.setText("클립보드 붙여넣기");
                  pasteButton.setOnClickListener(v -> pasteClipboard());
                  root.addView(pasteButton);

                  TextView qLabel = new TextView(this);
                  qLabel.setText("화질 선택");
                  qLabel.setTextSize(16);
                  qLabel.setPadding(0, dp(10), 0, dp(4));
                  root.addView(qLabel);

                  qualitySpinner = new Spinner(this);
                  String[] qualities = {"최고 화질", "1080p 이하", "720p 이하", "480p 이하"};
                  ArrayAdapter<String> adapter = new ArrayAdapter<>(
                      this, android.R.layout.simple_spinner_dropdown_item, qualities
                  );
                  qualitySpinner.setAdapter(adapter);
                  qualitySpinner.setSelection(1);
                  root.addView(qualitySpinner);

                  downloadButton = new Button(this);
                  downloadButton.setText("YouTube 영상 다운로드");
                  downloadButton.setEnabled(false);
                  downloadButton.setOnClickListener(v -> startDownload());
                  root.addView(downloadButton);

                  cancelButton = new Button(this);
                  cancelButton.setText("다운로드 취소");
                  cancelButton.setEnabled(false);
                  cancelButton.setOnClickListener(v -> cancelDownload());
                  root.addView(cancelButton);

                  progressBar = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  progressBar.setMax(100);
                  progressBar.setProgress(0);
                  root.addView(progressBar, new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, dp(20)
                  ));

                  statusView = new TextView(this);
                  statusView.setText("다운로드 엔진 준비 중...");
                  statusView.setTextSize(16);
                  statusView.setPadding(0, dp(10), 0, dp(4));
                  root.addView(statusView);

                  detailView = new TextView(this);
                  detailView.setText("저장 위치: 내 파일 → 다운로드 → AuthorizedVideoSaver");
                  detailView.setTextSize(13);
                  root.addView(detailView);

                  Button openButton = new Button(this);
                  openButton.setText("다운로드 폴더 열기");
                  openButton.setOnClickListener(v -> openDownloadFolder());
                  root.addView(openButton);

                  setContentView(scroll);
              }

              private void initializeDownloader() {
                  executor.execute(() -> {
                      try {
                          runOnUiThread(() -> statusView.setText("다운로드 엔진 초기화 중..."));
                          FFmpeg.getInstance().init(getApplicationContext());
                          YoutubeDL.getInstance().init(getApplicationContext());
                          ready = true;
                          runOnUiThread(() -> {
                              statusView.setText("준비 완료");
                              downloadButton.setEnabled(true);
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> {
                              statusView.setText("초기화 실패");
                              detailView.setText(safeMessage(e));
                          });
                      }
                  });
              }

              private void startDownload() {
                  if (!ready) {
                      toast("다운로드 엔진 준비가 끝날 때까지 잠시 기다려 주세요.");
                      return;
                  }
                  if (downloading) {
                      toast("이미 다운로드 중입니다.");
                      return;
                  }

                  final String url = urlInput.getText().toString().trim();
                  if (TextUtils.isEmpty(url)) {
                      toast("YouTube 주소를 입력하세요.");
                      return;
                  }
                  if (!isYouTubeUrl(url)) {
                      toast("youtube.com 또는 youtu.be 주소만 지원합니다.");
                      return;
                  }

                  final int qualityIndex = qualitySpinner.getSelectedItemPosition();
                  downloading = true;
                  processId = "yt_" + UUID.randomUUID();
                  downloadButton.setEnabled(false);
                  cancelButton.setEnabled(true);
                  progressBar.setProgress(0);
                  statusView.setText("다운로드 준비 중...");
                  detailView.setText("영상 정보를 확인하고 있습니다.");

                  executor.execute(() -> doDownload(url, qualityIndex));
              }

              private void doDownload(String url, int qualityIndex) {
                  File workDir = new File(getExternalFilesDir(Environment.DIRECTORY_MOVIES), "yt_temp");
                  deleteRecursively(workDir);
                  if (!workDir.exists()) workDir.mkdirs();

                  try {
                      YoutubeDLRequest request = new YoutubeDLRequest(url);
                      request.addOption("--no-playlist");
                      request.addOption("--no-mtime");
                      request.addOption("--newline");
                      request.addOption("--merge-output-format", "mp4");
                      request.addOption("-f", formatFor(qualityIndex));
                      request.addOption("-o", new File(workDir, "%(title).150B [%(id)s].%(ext)s").getAbsolutePath());

                      Function3<Float, Long, String, Unit> callback = (progress, eta, line) -> {
                          runOnUiThread(() -> {
                              int p = Math.max(0, Math.min(100, Math.round(progress)));
                              progressBar.setProgress(p);
                              statusView.setText("다운로드 중... " + p + "%");
                              if (line != null && !line.trim().isEmpty()) {
                                  detailView.setText(cleanLine(line));
                              } else if (eta >= 0) {
                                  detailView.setText("남은 시간 약 " + eta + "초");
                              }
                          });
                          return Unit.INSTANCE;
                      };

                      YoutubeDL.getInstance().execute(request, processId, callback);

                      File media = findOutputFile(workDir);
                      if (media == null) {
                          throw new Exception("완료된 영상 파일을 찾지 못했습니다.");
                      }

                      String savedName = publishToDownloads(media);
                      deleteRecursively(workDir);

                      runOnUiThread(() -> {
                          progressBar.setProgress(100);
                          statusView.setText("다운로드 완료");
                          detailView.setText("저장 완료: Download/AuthorizedVideoSaver/" + savedName);
                          finishDownloadState();
                      });
                  } catch (Exception e) {
                      final String msg = safeMessage(e);
                      deleteRecursively(workDir);
                      runOnUiThread(() -> {
                          progressBar.setProgress(0);
                          statusView.setText("다운로드 실패");
                          detailView.setText(msg);
                          finishDownloadState();
                      });
                  }
              }

              private String formatFor(int index) {
                  switch (index) {
                      case 0:
                          return "bestvideo+bestaudio/best";
                      case 2:
                          return "bestvideo[height<=720][ext=mp4]+bestaudio[ext=m4a]/best[height<=720][ext=mp4]/best[height<=720]";
                      case 3:
                          return "bestvideo[height<=480][ext=mp4]+bestaudio[ext=m4a]/best[height<=480][ext=mp4]/best[height<=480]";
                      case 1:
                      default:
                          return "bestvideo[height<=1080][ext=mp4]+bestaudio[ext=m4a]/best[height<=1080][ext=mp4]/best[height<=1080]";
                  }
              }

              private void cancelDownload() {
                  if (!downloading || processId == null) return;
                  try {
                      boolean stopped = YoutubeDL.getInstance().destroyProcessById(processId);
                      statusView.setText(stopped ? "취소 요청됨" : "취소할 작업이 없습니다.");
                  } catch (Exception e) {
                      detailView.setText(safeMessage(e));
                  }
              }

              private void finishDownloadState() {
                  downloading = false;
                  processId = null;
                  downloadButton.setEnabled(ready);
                  cancelButton.setEnabled(false);
              }

              private File findOutputFile(File dir) {
                  File[] files = dir.listFiles(file -> file.isFile()
                      && !file.getName().endsWith(".part")
                      && !file.getName().endsWith(".ytdl")
                      && isMediaFile(file.getName()));
                  if (files == null || files.length == 0) return null;
                  return Arrays.stream(files)
                      .max(Comparator.comparingLong(File::length))
                      .orElse(null);
              }

              private boolean isMediaFile(String name) {
                  String n = name.toLowerCase(Locale.ROOT);
                  return n.endsWith(".mp4") || n.endsWith(".webm") || n.endsWith(".mkv") ||
                         n.endsWith(".m4a") || n.endsWith(".mov");
              }

              private String publishToDownloads(File source) throws Exception {
                  String displayName = source.getName();
                  String mime = mimeFor(displayName);

                  ContentValues values = new ContentValues();
                  values.put(MediaStore.MediaColumns.DISPLAY_NAME, displayName);
                  values.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                  values.put(MediaStore.MediaColumns.RELATIVE_PATH,
                      Environment.DIRECTORY_DOWNLOADS + "/AuthorizedVideoSaver");
                  values.put(MediaStore.MediaColumns.IS_PENDING, 1);

                  ContentResolver resolver = getContentResolver();
                  Uri uri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                  if (uri == null) throw new Exception("다운로드 폴더에 파일을 만들 수 없습니다.");

                  try (InputStream in = new FileInputStream(source);
                       OutputStream out = resolver.openOutputStream(uri)) {
                      if (out == null) throw new Exception("저장 파일을 열 수 없습니다.");
                      byte[] buffer = new byte[1024 * 256];
                      int len;
                      while ((len = in.read(buffer)) != -1) out.write(buffer, 0, len);
                      out.flush();
                  } catch (Exception e) {
                      resolver.delete(uri, null, null);
                      throw e;
                  }

                  ContentValues done = new ContentValues();
                  done.put(MediaStore.MediaColumns.IS_PENDING, 0);
                  resolver.update(uri, done, null, null);
                  return displayName;
              }

              private String mimeFor(String name) {
                  String n = name.toLowerCase(Locale.ROOT);
                  if (n.endsWith(".webm")) return "video/webm";
                  if (n.endsWith(".mkv")) return "video/x-matroska";
                  if (n.endsWith(".mov")) return "video/quicktime";
                  if (n.endsWith(".m4a")) return "audio/mp4";
                  return "video/mp4";
              }

              private boolean isYouTubeUrl(String url) {
                  try {
                      Uri u = Uri.parse(url);
                      String host = u.getHost();
                      if (host == null) return false;
                      host = host.toLowerCase(Locale.ROOT);
                      return host.equals("youtu.be") || host.endsWith("youtube.com") ||
                             host.endsWith("youtube-nocookie.com");
                  } catch (Exception e) {
                      return false;
                  }
              }

              private void pasteClipboard() {
                  android.content.ClipboardManager cm =
                      (android.content.ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                  if (cm != null && cm.hasPrimaryClip() && cm.getPrimaryClip() != null &&
                      cm.getPrimaryClip().getItemCount() > 0) {
                      CharSequence text = cm.getPrimaryClip().getItemAt(0).coerceToText(this);
                      if (text != null) urlInput.setText(extractUrl(text.toString()));
                  } else {
                      toast("클립보드에 주소가 없습니다.");
                  }
              }

              private void receiveSharedText(Intent intent) {
                  if (intent == null) return;
                  if (Intent.ACTION_SEND.equals(intent.getAction()) && "text/plain".equals(intent.getType())) {
                      String shared = intent.getStringExtra(Intent.EXTRA_TEXT);
                      if (shared != null && urlInput != null) urlInput.setText(extractUrl(shared));
                  }
              }

              private String extractUrl(String text) {
                  if (text == null) return "";
                  for (String part : text.split("\\s+")) {
                      if (part.startsWith("https://") || part.startsWith("http://")) return part.trim();
                  }
                  return text.trim();
              }

              private void openDownloadFolder() {
                  try {
                      Uri uri = Uri.parse("content://com.android.externalstorage.documents/document/primary%3ADownload%2FAuthorizedVideoSaver");
                      Intent intent = new Intent(Intent.ACTION_VIEW);
                      intent.setDataAndType(uri, "resource/folder");
                      intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      startActivity(intent);
                  } catch (Exception e) {
                      toast("내 파일 → 다운로드 → AuthorizedVideoSaver 폴더를 열어 주세요.");
                  }
              }

              private void deleteRecursively(File file) {
                  if (file == null || !file.exists()) return;
                  if (file.isDirectory()) {
                      File[] children = file.listFiles();
                      if (children != null) for (File child : children) deleteRecursively(child);
                  }
                  file.delete();
              }

              private String cleanLine(String line) {
                  String s = line.replace('\r', ' ').trim();
                  if (s.length() > 180) s = s.substring(s.length() - 180);
                  return s;
              }

              private String safeMessage(Throwable e) {
                  String m = e == null ? null : e.getMessage();
                  if (m == null || m.trim().isEmpty()) return "알 수 없는 오류가 발생했습니다.";
                  if (m.length() > 700) m = m.substring(m.length() - 700);
                  return m;
              }

              private int dp(int value) {
                  return (int) (value * getResources().getDisplayMetrics().density + 0.5f);
              }

              private void toast(String text) {
                  Toast.makeText(this, text, Toast.LENGTH_LONG).show();
              }
          }
          EOF

      - name: Build v2 debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK signature
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AuthorizedVideoSaver_v2_1_YouTube.apk

      - name: Upload v2 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuthorizedVideoSaver-v2.1-YouTube-APK
          path: AuthorizedVideoSaver_v2_1_YouTube.apk
          if-no-files-found: error
