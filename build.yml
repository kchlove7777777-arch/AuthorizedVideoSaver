name: Build AuthorizedVideoSaver APK

on:
push:
branches: [ "main" ]
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
permissions:
contents: read
steps:
- name: Set up JDK 17
uses: actions/setup-java@v4
with:
distribution: temurin
java-version: '17'

- name: Set up Android SDK
uses: android-actions/setup-android@v3

- name: Install Android SDK packages
run: |
yes | sdkmanager --licenses >/dev/null || true
sdkmanager "platforms;android-35" "build-tools;35.0.0"

- name: Set up Gradle
uses: gradle/actions/setup-gradle@v4
with:
gradle-version: '8.10.2'

- name: Restore app source
run: |
echo '' | base64 -d > source.tar.gz
tar -xzf source.tar.gz

- name: Build debug APK
run: gradle --no-daemon :app:assembleDebug

- name: Verify APK
run: |
test -f app/build/outputs/apk/debug/app-debug.apk
ls -lh app/build/outputs/apk/debug/app-debug.apk
$ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk

- name: Upload APK artifact
uses: actions/upload-artifact@v4
with:
name: AuthorizedVideoSaver-apk
path: app/build/outputs/apk/debug/app-debug.apk
if-no-files-found: error
